name: Modellliste aktualisieren

on:
  schedule:
    - cron: "17 5 * * 1"   # montags, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: models.json aktualisieren
        run: python tools/update_models.py
      - name: Änderung einchecken
        run: |
          if [ -n "$(git status --porcelain models.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add models.json
            git commit -m "Modellliste aktualisiert"
            git push
          else
            echo "Keine Änderung."
          fi
